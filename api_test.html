<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test - Blader System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container mobile-container py-5">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-dark text-white p-4">
                <h1 class="h4 mb-0"><i class="bi bi-bug me-2"></i>Backend API Diagnostic</h1>
            </div>
            <div class="card-body p-4">
                <p class="text-muted small mb-4">Run diagnostic tests against the tournament creation API.</p>
                <button class="btn btn-primary w-100 fw-bold py-3 mb-4 shadow-sm" onclick="testAPI()">
                    Run Creation Test
                </button>
                <div id="result">
                    <div class="text-center text-muted p-5 bg-light rounded-3">
                        <i class="bi bi-terminal fs-1 d-block mb-3"></i>
                        Result output will appear here
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function testAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `
            <div class="d-flex align-items-center justify-content-center p-5">
                <div class="spinner-border text-primary me-3" role="status"></div>
                <span class="fw-bold">Executing diagnostic...</span>
            </div>
        `;

            try {
                const response = await fetch('test_create_api.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({
                        action: 'create',
                        name: 'Test Tournament',
                        tournament_type: 'single_elimination',
                        date: '2025-01-15',
                        number_of_stadiums: '2'
                    })
                });

                const responseText = await response.text();

                resultDiv.innerHTML = `
                <div class="alert ${response.ok ? 'alert-success' : 'alert-danger'} border-0 shadow-sm mb-3">
                    <i class="bi ${response.ok ? 'bi-check-circle-fill' : 'bi-exclamation-triangle-fill'} me-2"></i>
                    Status: <strong>${response.status}</strong>
                </div>
                <div class="bg-dark text-light p-3 rounded-3 shadow-sm overflow-auto" style="max-height: 400px;">
                    <pre class="mb-0 small" style="white-space: pre-wrap;">${responseText}</pre>
                </div>
            `;

            } catch (error) {
                resultDiv.innerHTML = `
                <div class="alert alert-danger border-0 shadow-sm">
                    <h5 class="alert-heading fw-bold">Network Error</h5>
                    <pre class="mb-0 small">${error.message}</pre>
                </div>
            `;
            }
        }
    </script>
</body>

</html>
